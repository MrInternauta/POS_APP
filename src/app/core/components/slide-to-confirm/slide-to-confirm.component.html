<div
  #track
  role="button"
  [attr.aria-label]="label"
  [attr.aria-disabled]="disabled"
  class="relative h-14 w-full select-none overflow-hidden rounded-lg bg-red-500"
  [ngClass]="{ 'opacity-60 cursor-not-allowed': disabled }">
  <!-- Fills in behind the knob so the gesture shows how far along it is -->
  <div
    class="absolute inset-y-0 left-0 bg-red-600"
    [ngClass]="{ 'transition-[width] duration-200': !dragging }"
    [style.width.px]="knobOffset + 48"></div>

  <span
    class="relative flex h-full items-center justify-center px-16 text-center text-md font-semibold text-white"
    [ngClass]="{ 'transition-opacity duration-200': !dragging }"
    [style.opacity]="1 - progress">
    {{ label }}
  </span>

  <span
    class="absolute top-1 left-1 flex h-12 w-12 items-center justify-center rounded-md bg-white text-red-500 shadow slide-knob"
    [ngClass]="{ 'transition-transform duration-200': !dragging, 'cursor-grab': !disabled, 'cursor-grabbing': dragging }"
    [style.transform]="'translateX(' + knobOffset + 'px)'"
    (pointerdown)="onPointerDown($event)">
    <ion-icon name="chevron-forward-outline" size="large"></ion-icon>
  </span>
</div>
