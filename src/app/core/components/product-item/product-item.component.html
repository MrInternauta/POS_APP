<ion-item [detail]="detailed" class="w-full" [ngClass]="{ 'cursor-pointer': detailed }">

  <div class="flex flex-col mb-4 mt-2">
    <p class=" text-2xl font-bold leading-9 tracking-tight mb-1 truncate uppercase">
      {{ name }}
    </p>
    <div class="flex flex-row">
      <ion-avatar slot="start" class="h-20 w-20 mr-4">
        <app-avatar  class="h-20 w-20 mr-4" [size]="'regular'" [img]="image || ''" [type]="'product'"></app-avatar>
      </ion-avatar>
      <ion-label>
        <p class="font-semibold">
          Stock:
          <span
            class="font-normal"
            [ngClass]="{
              'text-danger-hbr': stockValue <= 5,
              'text-warning': stockValue <= 15 && stockValue > 5
            }"
            >{{ stockValue }}</span
          >
        </p>
        <p *ngIf="isOutOfStock" class="font-semibold text-danger-hbr flex items-center gap-1">
          <ion-icon name="warning-outline"></ion-icon>
          Sin existencias
        </p>
        <p class="font-semibold" *ngIf="price">
          Price: <span class="font-normal">{{ price | currency }}</span>
        </p>
        <p class="font-semibold" *ngIf="category">
          Category:
          <span class="font-normal">{{ category }}</span>
        </p>
        <p *ngIf="description" class="font-semibold">
          Description:
          <span class="font-normal">{{ description }}</span>
        </p>
        <p *ngIf="quantity" class="font-semibold">
          Quantity:
          <span class="font-normal">{{ quantity }}</span>
        </p>
    
        <p *ngIf="quantity && price" class="font-semibold">
          Subtotal:
          <span class="font-normal">{{ subtotal | currency }}</span>
        </p>
      </ion-label>
    </div>
  </div>



</ion-item>
