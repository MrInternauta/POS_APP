<ion-header [translucent]="false" class="ion-no-border">
  <ion-toolbar>
    <ion-title>{{ 'profile.title' | transloco }}</ion-title>
    <ion-buttons slot="end">
      <ion-button
      (click)="authService.logout()"
      id="open-modal"
      color="primary">
      <ion-icon slot="start" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8" *ngIf="user$ | async as user">
    <div class="sm:mx-auto sm:w-full sm:max-w-sm md:max-w-md">
      <app-avatar
        (click)="updateUserPicture()"
        [size]="'large'"
        [img]="(user?.image || '')"
      ></app-avatar>
      <p
        *ngIf="!editMode"
        class="mt-4 text-center text-2xl font-bold leading-9 tracking-tight "
      >
        {{user?.name}} {{user?.lastName}}
      </p>
      <h3
        class="text-center text-xl font-normal leading-9 tracking-tight "
      >
      </h3>
    </div>

    <div class="sm:mx-auto sm:w-full sm:max-w-sm md:max-w-md">
      <div class="flex mt-4 w-full">
        <div class="w-1/2 mr-4">
          <app-input
            [inputValue]="user?.name ?? ''"
            [id]="'name'"
            [type]="'text'"
            [label]="'profile.name' | transloco"
            [required]="true"
            [maxLength]="100"
            (inputValueChange)="changeName($event)"
          ></app-input>
        </div>

        <div class="w-1/2">
          <app-input
          [inputValue]="user?.lastName ?? ''"
          [id]="'name'"
          [type]="'text'"
          [label]="'profile.lastName' | transloco"
          [required]="true"
          [maxLength]="100"
          (inputValueChange)="changelastName($event)"
          ></app-input>
        </div>
      </div>


      <div class="flex mt-4 w-full">
        <div class="w-1/2 mr-4">
          <app-input
            [inputValue]="user?.email || ''"
            [disabled]="true"
            [id]="'email'"
            [type]="'email'"
            [label]="'profile.email' | transloco"
            [required]="true"
            [maxLength]="100"
          ></app-input>
        </div>

        <div class="w-1/2">
          <app-input
            [inputValue]="user?.phone || ''"
            [id]="'phone'"
            [type]="'phone'"
            [label]="'profile.phone' | transloco"
            [maxLength]="100"
            (inputValueChange)="changePhone($event)"
          ></app-input>
        </div>
      </div>

      <div class="mt-4 text-center text-sm text-gray-500"
      *ngIf="!editMode"
      >
        <app-button
          [disabled]="!areChangesAvalible"
          [outline]="false"
          [label]="'profile.saveChanges' | transloco"
          size="large"
          (click)="editProfile()"
        ></app-button>
      </div>

      <div class="mt-8">
        <p class="mb-2 font-semibold">{{ 'profile.appearance' | transloco }}</p>
        <ion-segment [value]="themeMode$ | async" (ionChange)="changeTheme($event)">
          <ion-segment-button value="system">
            <ion-label>{{ 'profile.themeSystem' | transloco }}</ion-label>
          </ion-segment-button>
          <ion-segment-button value="light">
            <ion-label>{{ 'profile.themeLight' | transloco }}</ion-label>
          </ion-segment-button>
          <ion-segment-button value="dark">
            <ion-label>{{ 'profile.themeDark' | transloco }}</ion-label>
          </ion-segment-button>
        </ion-segment>
      </div>

      <div class="mt-6 mb-8">
        <p class="mb-2 font-semibold">{{ 'profile.language' | transloco }}</p>
        <ion-segment [value]="language$ | async" (ionChange)="changeLanguage($event)">
          <ion-segment-button value="es">
            <ion-label>Español</ion-label>
          </ion-segment-button>
          <ion-segment-button value="en">
            <ion-label>English</ion-label>
          </ion-segment-button>
          <ion-segment-button value="pt">
            <ion-label>Português</ion-label>
          </ion-segment-button>
        </ion-segment>
      </div>
    </div>
  </div>
</ion-content>
