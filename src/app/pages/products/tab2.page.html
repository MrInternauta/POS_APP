<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>{{ 'products.title' | transloco }}</ion-title>
    <ion-buttons slot="end">
      <ion-button *ngIf="canImport$ | async" color="primary" (click)="csvInput.click()">
        {{ 'products.import' | transloco }}
        <ion-icon slot="end" name="cloud-upload-outline"></ion-icon>
      </ion-button>
      <input
        #csvInput
        type="file"
        accept=".csv,text/csv,text/plain"
        hidden
        (change)="importCsv($event)" />
      <app-filter-popover [categories]="categories" (clickedItem)="clickedItem($event)" (clickedCategory)="clickedCategory($event)" [selectedFilteritem]="selectedFilteritem || filter.categoryId || ''"></app-filter-popover>
      
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      #search
      [ngModel]="searchValue"
      show-cancel-button="focus"
      show-clear-button="never"
      cancel-button-icon="trash"
      (ionCancel)="hideSearch()"
      class="sm:mx-[25%] sm:w-auto"
      (ngModelChange)="searchFunction($event || '')"
      [placeholder]="'products.searchPlaceholder' | transloco"></ion-searchbar>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <ng-container *ngIf="$observable | async as observableResult">
    <div class="flex min-h-full flex-col justify-start px-4 py-4 lg:px-6">
      <div class="sm:mx-auto sm:w-full sm:max-w-sm md:max-w-md">
        <div
          *ngIf="!loading && !observableResult.Exercise?.products?.length"
          class="flex min-h-full flex-col justify-start items-center">
          <div class="sm:mx-auto sm:w-full sm:max-w-sm md:max-w-md">
            <p class="text-center text-2xl font-bold leading-9 tracking-tight">{{ 'products.empty' | transloco }}</p>
          </div>
          <ion-icon name="sad-outline" size="large" class="text-center mt-4"></ion-icon>
        </div>
        <ion-list *ngIf="observableResult.Exercise?.products?.length">
          <ion-item-sliding
            *ngFor="let workout of observableResult.Exercise?.products; trackBy: trackByProduct">
            <ion-item-options side="start">
              <ion-item-option
                (click)="addToCard(workout, 1)"
                color="success"
                [disabled]="!workout?.stock || workout?.stock <= 0">
                <ion-icon slot="start" name="cart-outline"></ion-icon>
                {{ 'products.addToCart' | transloco }}</ion-item-option
              >
            </ion-item-options>

            <app-product-item
              [detailed]="true"
              [image]="workout?.image"
              [name]="workout?.name"
              [stock]="workout?.stock"
              [category]="workout?.category?.name"
              [price]="workout?.priceSell"
              [description]="workout?.description || workout?.code">
            </app-product-item>
            <ion-item-options slot="end">
              <ion-item-option (click)="edit(workout)" color="warning">
                <ion-icon slot="start" name="pencil-outline"></ion-icon>
                {{ 'common.edit' | transloco }}</ion-item-option
              >
            </ion-item-options>
          </ion-item-sliding>
        </ion-list>
      </div>
    </div>
  </ng-container>

  <ion-infinite-scroll [disabled]="!hasMoreProducts" (ionInfinite)="loadNextPage($event)">
    <ion-infinite-scroll-content loadingSpinner="bubbles" [loadingText]="'products.loadingMore' | transloco">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="openModal()" color="success" class="mb-4">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>

    <ion-fab-button (click)="scanCode()">
      <ion-icon name="barcode-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
